<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#83af60"><title>몽글몽글 수학 농장</title><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header><a class="home" href="../" aria-label="게임방으로">⌂</a><b class="brand">🌱 몽글 농장</b><nav class="place-nav" aria-label="장소 이동"><button id="go-farm" aria-pressed="true">🌱 농장</button><button id="go-market" aria-pressed="false">🏡 가판대</button></nav><div class="wallet">🪙 <b id="coins">0</b></div><button id="sound" class="round" aria-label="효과음 끄기">🔊</button><button id="settings" class="round" aria-label="설정">⚙</button><button id="help" class="round" aria-label="놀이 방법">?</button></header>
<main><div class="layout" id="places">
<section class="farm-card" id="farm-view"><div class="landscape"><div class="sky-cloud cloud-one"></div><div class="sky-cloud cloud-two"></div><div class="sun">☀</div><div class="hill h1"></div><div class="hill h2"></div><div class="farm-title" id="farm-tip">작물을 톡! 수확해요</div><div class="scenery"><span>🌳</span><div id="farmer"></div><span>🌳</span></div><div class="fence"></div><div id="plots" class="plots"></div><div id="decor" class="decor"></div><div id="decor-slots" class="decor-slots"></div><div id="placement-tip" hidden></div><div class="seed-bar"><div id="seeds"></div><button id="shop-open" class="small">🌱 씨앗 받기</button></div></div></section>
<aside class="order-card" id="market-view" hidden><div class="awning">모모의 숲속 가판대</div><div class="market-inner"><div class="visitor"><div class="customer" id="customer"><div id="animal"></div><h3 id="customer-name"></h3></div><div class="speech" id="speech"><span class="pill" id="order-kind"></span><p id="order-text"></p><span id="reward"></span></div><div class="order-footer"><button id="hint" aria-label="주문 힌트">💡 힌트</button><button id="next">다른 손님 ↻</button></div></div>
<div class="counter"><div id="packing-stage"><div class="mode-tabs"><button id="manual-mode" aria-pressed="true">🧺 담기</button><button id="calc-mode" aria-pressed="false">✏️ 계산</button></div><div id="produce-source"></div><div id="packing"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="deliver" class="primary">포장 완료 ♡</button></div><section id="checkout" hidden aria-label="계산대"></section><section id="sale-success" hidden aria-live="polite"></section></div></div></aside></div></main>
<footer><div id="warehouse-title" class="warehouse"><span>🧺 창고</span><div id="inventory"></div></div><span id="progress"></span><button id="decorate" class="small">🌷 꾸미기</button></footer>
<div hidden><span id="level"></span><span id="goal-text"></span><button id="sell-trip"></button><span id="save-status"></span></div></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="round" aria-label="닫기">×</button></div><div id="modal-body"></div></dialog>
<dialog id="settings-dialog"><div class="modal-head"><h2>놀이 설정</h2><button id="close-settings" class="round" aria-label="설정 닫기">×</button></div><label class="difficulty">학습 단계 <select id="difficulty"><option value="1">1 · 구구단과 똑같이 나누기</option><option value="2">2 · 더 큰 수와 나머지</option></select></label><button id="fullscreen" class="primary">⛶ 전체 화면으로 놀기</button><p class="setting-note">소리가 작고 부드럽게 재생돼요. 🔊 버튼으로 끌 수 있어요.</p></dialog>
<dialog id="number-dialog"><div class="modal-head"><h2>숫자를 골라요</h2><button id="close-number" class="round" aria-label="숫자 입력 닫기">×</button></div><output id="number-output">?</output><div id="number-keys"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="erase" aria-label="한 자리 지우기">⌫</button><button data-key="0">0</button><button data-key="ok">확인</button></div></dialog><div id="welcome"><div><span class="welcome-art">🐰 🌱 🐻</span><h1>몽글몽글 수학 농장</h1><p>쏙! 수확하고, 짤랑! 모아서, 내 농장을 꾸며요.</p><button id="start-play" class="primary">🔊 소리 켜고 놀기</button><button id="start-quiet" class="quiet">조용히 시작하기</button></div></div>
<div id="rotate-message"><span>📱 ↻</span><h2>가로로 돌려 주세요</h2><p>넓은 농장을 한 화면에서 함께 놀아요!</p></div>
<div id="toast" role="status"></div><div id="effects" aria-hidden="true"></div><script src="audio.js"></script><script src="game.js"></script></body></html>
