<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#79ad65"><title>몽글몽글 수학 농장</title><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header><a class="home" href="../" aria-label="게임방으로">⌂</a><a class="brand" href="./">🌱 몽글몽글 <span>수학 농장</span></a><div class="wallet">🪙 <b id="coins">0</b><span>코인</span></div><button id="help" class="round" aria-label="놀이 방법">?</button></header>
<main><div class="intro"><div><p class="eyebrow">LITTLE FARM, BIG DISCOVERIES</p><h1>작은 씨앗, 커다란 즐거움!</h1><p>쑥쑥 키우고, 차곡차곡 담아 동물 친구에게 전해 주세요.</p></div><div class="level"><span id="level">🌱 새싹 농부</span><small id="progress"></small></div></div>
<div class="layout"><section class="farm-card"><div class="section-head"><h2>나의 작은 텃밭 <span>☀ 맑음</span></h2><button id="shop-open" class="small">씨앗 상점 ↗</button></div><div class="landscape"><div class="sky-cloud cloud-one"></div><div class="sky-cloud cloud-two"></div><div class="sun">☀</div><div class="hill h1"></div><div class="hill h2"></div><div class="farm-title">🌼 MONGLE FARM 🌼</div><div class="scenery"><span>🌳</span><div id="farmer"></div><span>🌳</span></div><div class="fence"></div><div id="plots" class="plots"></div><div id="decor" class="decor"></div></div><div class="seed-bar"><div><b>무엇을 심을까요?</b><small>씨앗을 고르고 빈 밭을 눌러 주세요.</small></div><div id="seeds"></div></div><div class="farm-tip" id="farm-tip">🌱 다 자란 작물을 누르면 수확할 수 있어요.</div></section>
<aside class="order-card"><div class="section-head"><h2>오늘의 손님</h2><span class="pill" id="order-kind"></span></div><div class="customer"><div id="animal"></div><div><small>반가워요, 농부님!</small><h3 id="customer-name"></h3></div><span class="heart">♡</span></div><div class="speech"><p id="order-text"></p><span id="reward"></span></div><div class="mode-tabs"><button id="manual-mode" aria-pressed="true">🧺 직접 담기</button><button id="calc-mode" aria-pressed="false">✏️ 계산 포장</button></div><div id="packing"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="deliver" class="primary">포장해서 건네주기 ♡</button><div class="order-footer"><button id="hint">💡 같이 생각해요</button><button id="next">다른 주문 ↻</button></div><label class="difficulty">학습 단계 <select id="difficulty"><option value="1">1 · 구구단과 똑같이 나누기</option><option value="2">2 · 더 큰 수와 나머지</option></select></label></aside></div>
<section class="bottom-row"><div class="inventory-card"><h2>🧺 수확 바구니</h2><div id="inventory"></div></div><div class="goal-card"><span>🌷</span><div><h2>조금씩 자라는 나의 농장</h2><p id="goal-text"></p></div><button id="decorate" class="small">꾸미기 · 40 🪙</button></div></section><footer><span>서두르지 않아도 괜찮아요. 함께 생각해 봐요 ♡</span><span id="save-status">이 기기에 자동 저장돼요</span></footer></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="round" aria-label="닫기">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status"></div><script src="game.js"></script></body></html>
