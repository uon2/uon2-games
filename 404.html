<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b22">
  <title>길을 잃었어요</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(#6fb6ff, #b5ddff);
      color: #fff;
      font-family: 'Galmuri11', system-ui, sans-serif;
      text-align: center;
    }
    .box { padding: 24px; }
    h1 { font-size: clamp(36px, 8vmin, 72px); margin: 0 0 0.2em; text-shadow: 4px 4px 0 #3a3a3a; }
    p { font-size: clamp(18px, 3vmin, 28px); margin: 0 0 1.4em; text-shadow: 2px 2px 0 #245; }
    a {
      display: inline-block;
      font-size: clamp(20px, 3vmin, 30px);
      color: #fff;
      text-decoration: none;
      background: #3f8f2f;
      border: 3px solid #111;
      padding: 0.5em 1.2em;
      box-shadow: inset -4px -4px 0 #2a6420, inset 4px 4px 0 #6fc257;
      text-shadow: 2px 2px 0 #333;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⛏️ 길을 잃었어요</h1>
    <p>이 주소에는 아무것도 없어요.</p>
    <a href="/">🎮 게임방으로 가기</a>
  </div>
</body>
</html>
