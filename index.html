<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b22">
  <title>블록 게임방</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#6fb6ff, #b5ddff);
      color: #fff;
      font-family: 'Galmuri11', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hub {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vmin, 20px);
      padding: 16px 16px 16vh;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-family: 'Galmuri14', 'Galmuri11', system-ui, sans-serif;
      font-size: clamp(40px, 8vmin, 88px);
      text-shadow: 5px 5px 0 #3a3a3a, 9px 9px 0 rgba(0, 0, 0, 0.2);
    }

    .sub {
      margin: 0 0 0.6em;
      font-size: clamp(20px, 3.4vmin, 34px);
      text-shadow: 2px 2px 0 #245;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(12px, 3vmin, 28px);
      justify-content: center;
    }

    .game {
      width: clamp(200px, 30vmin, 280px);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: #c6c6c6;
      color: #3a3a3a;
      text-decoration: none;
      border: 4px solid #111;
      box-shadow: inset -5px -5px 0 #555, inset 5px 5px 0 #fff;
    }
    a.game:active { transform: translateY(3px); }

    .game img,
    .game .soon-icon {
      width: clamp(80px, 12vmin, 120px);
      height: clamp(80px, 12vmin, 120px);
      border: 3px solid #111;
      image-rendering: pixelated;
    }
    .game .soon-icon {
      display: grid;
      place-items: center;
      background: #6a6a6a;
      font-size: clamp(36px, 6vmin, 56px);
    }

    .game b, .game span { word-break: keep-all; }
    .game b { font-size: clamp(20px, 3vmin, 28px); }
    .game span { font-size: clamp(15px, 2.2vmin, 20px); }
    .game.soon { filter: grayscale(0.7) brightness(0.85); }

    .ground {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 14vh;
      background:
        linear-gradient(#5fa83b, #5fa83b) top / 100% 18px no-repeat,
        repeating-conic-gradient(#79553a 0 25%, #6c4a31 0 50%) 0 0 / 24px 24px;
      border-top: 4px solid rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <main class="hub">
    <h1 class="logo">블록 게임방</h1>
    <p class="sub">어떤 게임을 할까요?</p>
    <div class="games">
      <a class="game" href="english/">
        <img src="icons/icon-192.png" alt="">
        <b>영어 블록 월드</b>
        <span>숲속 모험 · 보물 마법 · 내 방</span>
      </a>
      <a class="game" href="math/">
        <div class="soon-icon" style="background:#c6dda5">🐰🥕</div>
        <b>몽글몽글 수학 농장</b>
        <span>씨앗 재배 · 동물 주문 · 수학 놀이</span>
      </a>
    </div>
  </main>
  <div class="ground"></div>

  <script>
    // 홈 화면 설치와 오프라인 실행을 위한 서비스 워커 (HTTPS 또는 localhost에서만 동작)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
